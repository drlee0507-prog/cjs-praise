name: 곡 제목 채우기

on:
  push:
    paths: ['songs.js']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  titles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fetch_titles.py songs.js
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add songs.js
          git diff --cached --quiet || git commit -m "곡 제목 자동 채움"
          git push
